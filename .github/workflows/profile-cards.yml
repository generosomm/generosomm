name: Update live profile cards

# Rebuilds the snake and the live stat cards, then publishes them to the
# `output` branch that README.md reads from.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build live cards (generosomm.dev stats + GitHub activity)
        run: node scripts/build-cards.mjs live dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2bd47d&color_dots=#ebedf0,#c6f2da,#7fe3ad,#2bd47d,#1a8f53
            dist/github-snake-dark.svg?color_snake=#2bd47d&color_dots=#161616,#0f3d26,#16663e,#1fa660,#2bd47d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
